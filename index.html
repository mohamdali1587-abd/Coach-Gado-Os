<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0b0b"><link rel="manifest" href="manifest.webmanifest"><title>Coach Gado v3</title><style>
:root{--bg:#090909;--card:#151515;--muted:#999;--text:#f4f4f4;--red:#e10600;--line:#292929;--ok:#28c76f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Tahoma,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:1100px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:#090909ee;backdrop-filter:blur(10px);padding:10px 0;z-index:5}.brand{font-weight:900;font-size:22px}.brand b{color:var(--red)}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#111;color:#ddd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.hero{padding:22px;border:1px solid #333;border-radius:20px;background:linear-gradient(135deg,#171717,#0d0d0d)}h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.num{font-size:28px;font-weight:900}.btn{border:0;border-radius:11px;padding:11px 14px;background:#292929;color:#fff}.btn.red{background:var(--red)}.btn.ok{background:#147a45}.btn.out{background:transparent;border:1px solid #444}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.field{display:flex;flex-direction:column;gap:6px;margin:8px 0}.field input,.field select,.field textarea{background:#0e0e0e;color:#fff;border:1px solid #363636;border-radius:10px;padding:10px}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0;position:sticky;top:52px;background:#090909ee;z-index:4}.tabs button{white-space:nowrap}.tab.active{background:var(--red)}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:18px;right:18px;background:#222;border:1px solid #444;border-radius:12px;padding:12px;display:none;z-index:20}.list{display:flex;flex-direction:column;gap:8px}.item{padding:12px;border:1px solid var(--line);border-radius:12px;background:#101010}.metric{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(460px,100%)}.logo{font-size:42px;font-weight:900;margin-bottom:8px}.logo span{color:var(--red)}small{color:#888}@media(max-width:600px){.wrap{padding:12px}.hero{padding:16px}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
const KEY='coach_gado_v3';let S=JSON.parse(localStorage.getItem(KEY)||'null')||{logged:false,role:'coach',coach:{name:'Coach Gado'},clients:[{id:'c1',name:'Ahmed Ali',age:31,weight:84,height:178,goal:'Fat Loss',cal:2100,protein:170,carbs:220,fat:65,program:'Fat Loss 3D',lastCheck:'2026-09-24'}],selected:'c1',exercises:[{id:'e1',name:'Squat',muscle:'Legs',video:''},{id:'e2',name:'Bench Press',muscle:'Chest',video:''},{id:'e3',name:'Lat Pulldown',muscle:'Back',video:''}],logs:[],meals:[],checkins:[]};function save(){localStorage.setItem(KEY,JSON.stringify(S))}function toast(x){let t=document.getElementById('toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2200)}function esc(x=''){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function client(){return S.clients.find(x=>x.id===S.selected)||S.clients[0]}
function login(){document.getElementById('app').innerHTML=`<div class="login"><div class="loginbox"><div class="logo">COACH <span>GADO</span></div><p class="muted">Training • Nutrition • Client Management</p><div class="card"><h2>تسجيل الدخول</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" value="coach@coachgado.com"></div><div class="field"><label>كلمة المرور</label><input id="pass" type="password" value="123456"></div><div class="field"><label>نوع الحساب</label><select id="role"><option value="coach">Coach</option><option value="client">Client</option></select></div><button class="btn red" style="width:100%" onclick="doLogin()">دخول</button><p><small>نسخة تجريبية: البيانات محفوظة على الجهاز حاليًا.</small></p></div></div></div>`}function doLogin(){S.logged=true;S.role=document.getElementById('role').value;save();render();toast('تم تسجيل الدخول')}
function render(){if(!S.logged)return login();if(S.role==='client')return clientView();coachView()}
function nav(active){return `<div class="tabs">${[['dash','الرئيسية'],['clients','العملاء'],['training','التدريب'],['nutrition','التغذية'],['progress','المتابعة'],['library','التمارين'],['ai','مساعد AI'],['settings','الإعدادات']].map(x=>`<button class="btn tab ${active===x[0]?'active':''}" onclick="page('${x[0]}')">${x[1]}</button>`).join('')}<button class="btn out" onclick="logout()">خروج</button></div>`}
function shell(title,active,body){document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div class="brand">COACH <b>GADO</b></div><span class="pill">Coach Mode</span></div>${nav(active)}<div style="margin-top:12px">${body}</div></div>`}
function coachView(){page('dash')}
function page(p){if(!S.logged)return login();let c=client();if(p==='dash')shell('','dash',`<div class="hero"><h1>أهلاً Coach Gado 👋</h1><p class="muted">لوحة التحكم الخاصة بك</p><div class="grid"><div class="card"><div class="muted">العملاء</div><div class="num">${S.clients.length}</div></div><div class="card"><div class="muted">تمارين اليوم</div><div class="num">${S.logs.filter(x=>x.date===new Date().toISOString().slice(0,10)).length}</div></div><div class="card"><div class="muted">Check-ins</div><div class="num">${S.checkins.length}</div></div></div></div><div class="card" style="margin-top:12px"><h2>العميل الحالي</h2><div class="row"><select onchange="S.selected=this.value;save();page('dash')">${S.clients.map(x=>`<option value="${x.id}" ${x.id===S.selected?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button class="btn red" onclick="page('training')">فتح البرنامج</button></div></div>`);
else if(p==='clients')shell('','clients',`<div class="row"><h2 style="margin-left:auto">العملاء</h2><button class="btn red" onclick="addClient()">+ إضافة عميل</button></div><div class="list">${S.clients.map(x=>`<div class="item"><b>${esc(x.name)}</b><div class="muted">${x.age||'-'} سنة • ${x.weight||'-'} كجم • ${esc(x.goal||'')}</div><div class="row" style="margin-top:8px"><button class="btn" onclick="S.selected='${x.id}';save();page('dash')">فتح</button><button class="btn out" onclick="delClient('${x.id}')">حذف</button></div></div>`).join('')}</div>`);
else if(p==='training')shell('','training',`<h2>Training Builder — ${esc(c?.name||'')}</h2><div class="grid"><div class="card"><h3>برنامج جديد</h3><div class="field"><label>اسم البرنامج</label><input id="pname" value="${esc(c?.program||'Program 1')}"></div><div class="field"><label>المدة</label><select id="days"><option>3 أيام</option><option>4 أيام</option><option>5 أيام</option></select></div><button class="btn red" onclick="saveProgram()">حفظ البرنامج</button></div><div class="card"><h3>تمارين العميل</h3><div class="list">${S.exercises.map(e=>`<div class="item"><b>${esc(e.name)}</b><span class="muted"> • ${esc(e.muscle)}</span><button class="btn" style="float:left" onclick="logWorkout('${e.id}')">✓ Log</button></div>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><h3>Workout History</h3>${S.logs.filter(x=>x.client===c?.id).slice(-8).reverse().map(x=>`<div class="metric"><span>${esc(x.exercise)}</span><span>${x.date} • ${x.sets}×${x.reps} • ${x.weight}kg</span></div>`).join('')||'<span class="muted">لا يوجد تسجيل بعد.</span>'}</div>`);
else if(p==='nutrition')shell('','nutrition',`<h2>Nutrition — ${esc(c?.name||'')}</h2><div class="grid"><div class="card"><h3>Targets</h3><div class="metric"><span>Calories</span><b>${c?.cal||0}</b></div><div class="metric"><span>Protein</span><b>${c?.protein||0}g</b></div><div class="metric"><span>Carbs</span><b>${c?.carbs||0}g</b></div><div class="metric"><span>Fat</span><b>${c?.fat||0}g</b></div></div><div class="card"><h3>Meal Plan</h3><div class="field"><input id="meal" placeholder="مثال: 150g rice + 180g chicken"></div><button class="btn red" onclick="addMeal()">إضافة وجبة</button><div class="list" style="margin-top:10px">${S.meals.filter(x=>x.client===c?.id).map(x=>`<div class="item">${esc(x.text)}</div>`).join('')}</div></div></div>`);
else if(p==='progress')shell('','progress',`<h2>Progress & Check-in — ${esc(c?.name||'')}</h2><div class="grid"><div class="card"><h3>آخر بيانات</h3><div class="metric"><span>Weight</span><b>${c?.weight||'-'} kg</b></div><div class="metric"><span>Goal</span><b>${esc(c?.goal||'-')}</b></div><div class="metric"><span>Last Check-in</span><b>${c?.lastCheck||'-'}</b></div></div><div class="card"><h3>Weekly Check-in</h3><button class="btn red" onclick="checkin()">تسجيل Check-in</button><div class="list" style="margin-top:10px">${S.checkins.filter(x=>x.client===c?.id).slice(-5).reverse().map(x=>`<div class="item">${x.date} • ${x.weight}kg • Energy ${x.energy}/10 • Adherence ${x.adherence}/10</div>`).join('')}</div></div></div>`);
else if(p==='library')shell('','library',`<div class="row"><h2 style="margin-left:auto">Exercise Library</h2><button class="btn red" onclick="addExercise()">+ تمرين</button></div><div class="list">${S.exercises.map(e=>`<div class="item"><b>${esc(e.name)}</b> <span class="muted">${esc(e.muscle)}</span>${e.video?`<div><a href="${esc(e.video)}" target="_blank" style="color:#ff5b55">Video ↗</a></div>`:''}</div>`).join('')}</div>`);
else if(p==='ai')shell('','ai',`<div class="card"><h2>مساعد AI</h2><p class="muted">راجع بيانات العميل وأضف أي تفاصيل تريد تحليلها.</p><div class="field"><label for="aiGoal">هدف العميل وبياناته</label><textarea id="aiGoal" rows="8" style="width:100%;resize:vertical">${esc(aiClientPrompt(c))}</textarea></div><button id="aiAnalyze" class="btn red" onclick="analyzeClient()">تحليل بالذكاء الاصطناعي</button><div id="aiResult" class="item" role="status" aria-live="polite" style="display:none;white-space:pre-wrap;margin-top:12px"></div></div>`);
else shell('','settings',`<div class="card"><h2>Settings</h2><button class="btn" onclick="backup()">تصدير Backup</button> <button class="btn" onclick="document.getElementById('imp').click()">استيراد</button><input id="imp" class="hidden" type="file" accept="application/json" onchange="restore(this)"><hr><button class="btn out" onclick="resetDemo()">Reset Demo Data</button></div>`)}
function aiClientPrompt(c){if(!c)return '';return [['هدف العميل',c.goal],['العمر',c.age!=null&&Number(c.age)>0?`${c.age} سنة`:null],['الوزن',c.weight!=null&&Number(c.weight)>0?`${c.weight} كجم`:null],['الطول',c.height!=null&&Number(c.height)>0?`${c.height} سم`:null]].filter(x=>x[1]!=null&&String(x[1]).trim()!=='').map(x=>`${x[0]}: ${x[1]}`).join('\n')}
async function analyzeClient(){let button=document.getElementById('aiAnalyze'),result=document.getElementById('aiResult'),goal=document.getElementById('aiGoal').value.trim();if(!goal){result.style.display='block';result.style.color='#ff8a80';result.textContent='اكتب هدف العميل وبياناته أولاً.';return}button.disabled=true;button.textContent='جارٍ التحليل...';result.style.display='block';result.style.color='';result.textContent='جارٍ تحليل بيانات العميل...';try{let response=await fetch('/api/dify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client_goal:goal})});let data=await response.json();if(!response.ok)throw new Error(data.error||'تعذر تحليل بيانات العميل.');if(typeof data.answer!=='string'||!data.answer.trim())throw new Error('لم يتم استلام إجابة من المساعد.');result.textContent=data.answer}catch(error){result.style.color='#ff8a80';result.textContent=error instanceof Error?error.message:'حدث خطأ غير متوقع أثناء التحليل.'}finally{button.disabled=false;button.textContent='تحليل بالذكاء الاصطناعي'}}
function addClient(){let n=prompt('اسم العميل؟');if(!n)return;let id='c'+Date.now();S.clients.push({id,name:n,age:0,weight:0,height:0,goal:'',cal:0,protein:0,carbs:0,fat:0,program:'New Program',lastCheck:''});S.selected=id;save();page('clients');toast('تمت إضافة العميل')}
function delClient(id){if(!confirm('حذف العميل؟'))return;S.clients=S.clients.filter(x=>x.id!==id);S.selected=S.clients[0]?.id;save();page('clients')}
function saveProgram(){let c=client();c.program=document.getElementById('pname').value;save();toast('تم حفظ البرنامج')}
function logWorkout(eid){let e=S.exercises.find(x=>x.id===eid);let sets=prompt('Sets','3'),reps=prompt('Reps','10'),weight=prompt('Weight kg','0');if(sets==null)return;S.logs.push({client:S.selected,exercise:e.name,sets,reps,weight,date:new Date().toISOString().slice(0,10)});save();page('training');toast('تم تسجيل التمرين')}
function addMeal(){let t=document.getElementById('meal').value.trim();if(!t)return;S.meals.push({client:S.selected,text:t});save();page('nutrition');toast('تمت إضافة الوجبة')}
function checkin(){let w=prompt('الوزن kg',client().weight||'');if(w==null)return;let e=prompt('Energy 1-10','7'),a=prompt('Adherence 1-10','8');S.checkins.push({client:S.selected,weight:w,energy:e,adherence:a,date:new Date().toISOString().slice(0,10)});client().weight=Number(w);client().lastCheck=new Date().toISOString().slice(0,10);save();page('progress');toast('تم تسجيل Check-in')}
function addExercise(){let n=prompt('اسم التمرين؟');if(!n)return;let m=prompt('Muscle group؟','General'),v=prompt('Video URL (اختياري)','');S.exercises.push({id:'e'+Date.now(),name:n,muscle:m,video:v});save();page('library')}
function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='coach-gado-backup.json';a.click()}
function restore(inp){let f=inp.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();render();toast('تم الاستيراد')}catch(e){toast('ملف غير صالح')}};r.readAsText(f)}
function resetDemo(){if(!confirm('إعادة بيانات التجربة؟'))return;localStorage.removeItem(KEY);location.reload()}
function logout(){S.logged=false;save();render()}
function clientView(){let c=client();document.getElementById('app').innerHTML=`<div class="wrap"><div class="top"><div class="brand">COACH <b>GADO</b></div><span class="pill">Client Mode</span><button class="btn out" onclick="logout()">خروج</button></div><div class="hero" style="margin-top:15px"><h1>مرحبًا ${esc(c?.name||'Client')} 👋</h1><p class="muted">برنامجك وخطة التغذية والمتابعة</p></div><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">Calories</div><div class="num">${c?.cal||0}</div></div><div class="card"><div class="muted">Protein</div><div class="num">${c?.protein||0}g</div></div><div class="card"><div class="muted">Weight</div><div class="num">${c?.weight||0}</div></div></div><div class="card" style="margin-top:12px"><h2>Today's Workout</h2>${S.exercises.map(e=>`<div class="item" style="margin:8px 0"><b>${esc(e.name)}</b><span class="muted"> • 3 × 10</span><button class="btn ok" style="float:left" onclick="clientLog('${e.id}')">تم</button></div>`).join('')}</div><div class="card" style="margin-top:12px"><h2>Weekly Check-in</h2><button class="btn red" onclick="checkin()">إرسال Check-in</button></div></div>`}
function clientLog(eid){let e=S.exercises.find(x=>x.id===eid);S.logs.push({client:S.selected,exercise:e.name,sets:3,reps:10,weight:0,date:new Date().toISOString().slice(0,10)});save();toast('تم تسجيل التمرين ✓')}
render();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
