:root{--bg:#101012;--panel:#1b1b1f;--panel2:#25252b;--red:#db2126;--text:#f5f5f5;--muted:#aaaab2;--line:#38383f;--green:#31c48d;--amber:#ffca68}

.list{display:flex;flex-direction:column;gap:8px}.item{background:#131317;border:1px solid var(--line);border-radius:10px;padding:12px}.item-title{font-weight:800}.tag{display:inline-block;background:#303038;padding:4px 8px;border-radius:99px;font-size:11px;color:#ddd}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:620px}.table th,.table td{text-align:right;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.table th{color:var(--muted)}
.notice{padding:12px;border-radius:10px;border:1px solid #76541e;background:#332818;color:#ffdda2;margin:12px 0}.success{color:var(--green)}.error{color:#ff8185}.empty{padding:24px;text-align:center;color:var(--muted)}.hidden{display:none!important}
.auth{min-height:100vh;display:grid;place-items:center;padding:18px}.authbox{width:min(480px,100%)}.authbox .card{padding:22px}.auth-title{font-size:28px;font-weight:900;margin:0}.auth-title b{color:var(--red)}.toast{position:fixed;bottom:18px;left:18px;right:18px;z-index:50;background:#29292f;border:1px solid #555;border-radius:10px;padding:12px;display:none}.footer{color:var(--muted);font-size:11px;padding:20px 0}

<script>
'use strict';
const SUPABASE_URL='https://glvkkbqtgwfezurkbmek.supabase.co';
const SUPABASE_KEY='sb_publishable_7h2Oz70ypR9UTmh16rAK0g_Hnt14YfV';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

function toast(s,isError=false){let e=$('#toast');e.textContent=s;e.style.display='block';e.style.borderColor=isError?'#a33':'#555';setTimeout(()=>e.style.display='none',3500)}
function money(v){return (Number(v)||0).toLocaleString('en-US')+' ج.م'}

function showAuth(mode){let app=$('#app');app.innerHTML='<div class="auth"><div class="authbox"><div class="brand" style="margin-bottom:14px"><div class="logo">G</div><div>COACH <b>GADO</b><div class="muted" style="font-size:12px">FITNESS HUB · CLIENT PORTAL</div></div></div><div class="card"><h2 class="auth-title">'+(mode==='signup'?'إنشاء حساب':'تسجيل الدخول')+'</h2><p class="muted">حساب آمن لكل مدرب وعميل. بياناتك محفوظة على قاعدة بيانات خاصة.</p><div id="authError" class="notice hidden"></div><form id="authForm"><div class="field"><label>الاسم بالكامل</label><input id="fullName" autocomplete="name" '+(mode==='signup'?'required':'')+' placeholder="الاسم" '+(mode==='signup'?'':'class="hidden"')+'></div><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required autocomplete="email" placeholder="name@example.com"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" required minlength="8" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" placeholder="8 أحرف على الأقل"></div>'+(mode==='signup'?'<div class="field"><label>نوع الحساب</label><select id="accountType"><option value="client">عميل — Client</option><option value="coach">مدرب — Coach</option></select></div><div class="field"><label>كود الدعوة / تفعيل المدرب</label><input id="inviteCode" placeholder="أدخل الكود إذا كان لديك"></div>':'<div class="field"><label>كود دعوة (اختياري)</label><input id="inviteCode" placeholder="كود دعوة العميل أو تفعيل المدرب"></div>')+'<button class="btn primary" id="authSubmit" style="width:100%;margin-top:8px">'+(mode==='signup'?'إنشاء الحساب':'دخول')+'</button></form><div class="row" style="justify-content:space-between;margin-top:14px"><button class="btn" id="switchAuth">'+(mode==='signup'?'لديك حساب؟ تسجيل الدخول':'إنشاء حساب جديد')+'</button><button class="btn" id="forgot">نسيت كلمة المرور؟</button></div><p class="muted" style="font-size:11px;margin-top:15px">لا تستخدم حسابًا مشتركًا. كل عميل يرى بياناته فقط وفق صلاحيات قاعدة البيانات.</p></div></div></div>';
$('#switchAuth').onclick=()=>showAuth(mode==='signup'?'login':'signup');
$('#forgot').onclick=async()=>{let email=$('#email').value.trim();if(!email)return toast('اكتب البريد الإلكتروني أولًا',true);let r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});if(r.error)toast(r.error.message,true);else toast('تم إرسال رابط إعادة تعيين كلمة المرور إذا كان البريد مسجلًا')};
$('#authForm').onsubmit=async e=>{e.preventDefault();let btn=$('#authSubmit');btn.disabled=true;btn.textContent='جارٍ التنفيذ...';let email=$('#email').value.trim().toLowerCase(),password=$('#password').value,code=$('#inviteCode').value.trim(),name=$('#fullName')?.value.trim()||'';
try{if(mode==='signup'){let r=await sb.auth.signUp({email,password,options:{data:{full_name:name},emailRedirectTo:location.origin}});if(r.error)throw r.error;if(!r.data.session){if(code){localStorage.setItem('pendingCoachGadoInvite',code);localStorage.setItem('pendingCoachGadoInviteType',$('#accountType').value)}toast('تم إنشاء الحساب. راجع بريدك لتأكيد الحساب ثم سجّل الدخول لتفعيل الدعوة.');showAuth('login');return}if(code){await redeemInvite(code,$('#accountType').value)}await startApp()}else{let r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(code)await redeemInvite(code,'auto');await startApp()}}catch(err){let n=$('#authError');n.classList.remove('hidden');n.textContent=err.message||'تعذر إكمال العملية'}finally{btn.disabled=false;btn.textContent=mode==='signup'?'إنشاء الحساب':'دخول'}};
}
async function redeemInvite(code,kind){if(!code)return;let rpc=kind==='coach'?'redeem_coach_invite':kind==='client'?'redeem_client_invite':'redeem_coach_invite';let r=await sb.rpc(rpc,{p_token:code});if(r.error&&kind==='auto'){r=await sb.rpc('redeem_client_invite',{p_token:code})}if(r.error)throw r.error;localStorage.removeItem('pendingCoachGadoInvite');toast('تم تفعيل الدعوة بنجاح')}
async function startApp(){let s=await sb.auth.getSession();user=s.data.session?.user;if(!user){showAuth('login');return}let p=await sb.from('profiles').select('*').eq('id',user.id).single();if(p.error)throw p.error;profile=p.data;if(!profile.is_active){await sb.auth.signOut();throw new Error('الحساب غير نشط. تواصل مع المدرب.')}if(profile.role==='client'){let pending=localStorage.getItem('pendingCoachGadoInvite');if(pending){try{let kind=localStorage.getItem('pendingCoachGadoInviteType')||'client';await redeemInvite(pending,kind);let fresh=await sb.from('profiles').select('*').eq('id',user.id).single();profile=fresh.data}catch(e){toast('تعذر تفعيل الدعوة: '+e.message,true)}}}await loadCore();render()}
async function loadCore(){if(profile.role==='coach'||profile.role==='admin'){let [c,p,n,f,x,a]=await Promise.all([sb.from('coach_clients').select('id,client_id,status,start_date,end_date,notes,profiles!coach_clients_client_id_fkey(id,full_name,phone,is_active)').eq('coach_id',user.id).order('created_at',{ascending:false}),sb.from('programs').select('*').eq('coach_id',user.id).eq('is_archived',false).order('created_at',{ascending:false}),sb.from('nutrition_plans').select('*').eq('coach_id',user.id).order('created_at',{ascending:false}),sb.from('foods').select('*').or('is_public.eq.true,owner_coach_id.eq.'+user.id).limit(1000),sb.from('exercises').select('*').or('is_public.eq.true,owner_coach_id.eq.'+user.id).limit(1500),sb.from('client_assignments').select('*').eq('coach_id',user.id).order('created_at',{ascending:false})]);for(let z of [c,p,n,f,x,a])if(z.error)throw z.error;cache.clients=c.data||[];cache.programs=p.data||[];cache.plans=n.data||[];cache.foods=f.data||[];cache.exercises=x.data||[];cache.assignments=a.data||[]}else{let [a,m,w]=await Promise.all([sb.from('client_assignments').select('*,programs(title,description),nutrition_plans(title,calories_target,protein_target_g,carbs_target_g,fats_target_g)').eq('client_id',user.id).eq('status','active').order('created_at',{ascending:false}),sb.from('measurements').select('*').eq('client_id',user.id).order('measured_at',{ascending:false}).limit(20),sb.from('daily_checkins').select('*').eq('client_id',user.id).order('checkin_date',{ascending:false}).limit(30)]);if(a.error)throw a.error;if(m.error)throw m.error;if(w.error)throw w.error;cache.assignments=a.data||[];cache.measurements=m.data||[];cache.checkins=w.data||[]}}
function isCoach(){return profile&&['coach','admin'].includes(profile.role)}
function header(){return '<div class="top"><div class="brand"><div class="logo">G</div><div>COACH <b>GADO</b><div class="muted" style="font-size:11px">FITNESS HUB</div></div></div><div class="actions"><span class="pill">'+esc(profile.full_name||user.email)+' · '+(isCoach()?'COACH':'CLIENT')+'</span><button class="btn" onclick="backupData()">نسخة احتياطية</button><button class="btn" onclick="printReport()">طباعة التقرير</button><button class="btn danger" onclick="logout()">خروج</button></div></div>'}
function nav(){let items=isCoach()?[['dashboard','الرئيسية'],['clients','العملاء'],['programs','التدريب'],['nutrition','التغذية'],['progress','المتابعة'],['billing','الاشتراكات'],['library','المكتبات']]:[['dashboard','الرئيسية'],['training','برنامجك'],['nutrition','التغذية'],['progress','متابعتك']];return '<nav class="nav">'+items.map(x=>'<button class="btn '+(tab===x[0]?'active':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')+'</nav>'}

function dashboard(){if(isCoach()){let active=cache.clients.filter(c=>c.status==='active').length;return '<div class="grid">'+metric('إجمالي العملاء',cache.clients.length)+metric('العملاء النشطون',active)+metric('البرامج التدريبية',cache.programs.length)+metric('خطط التغذية',cache.plans.length)+'</div><div class="card section"><h2>مساحة عمل المدرب</h2><p class="muted">أدر عملاءك، أنشئ البرامج والخطط، اربطها بالعملاء، وسجل التقدم والاشتراكات. كل البيانات تُحفظ على قاعدة البيانات السحابية.</p><div class="actions"><button class="btn primary" onclick="go(\'clients\')">إضافة عميل</button><button class="btn" onclick="go(\'programs\')">إنشاء برنامج</button><button class="btn" onclick="go(\'nutrition\')">إنشاء خطة تغذية</button></div></div><div class="card section"><h2>آخر العملاء</h2>'+clientList().slice(0,5000)+'</div>'}
let a=cache.assignments[0];return '<div class="grid">'+metric('البرامج النشطة',cache.assignments.length)+metric('آخر وزن مسجل',cache.measurements?.[0]?.weight_kg?cache.measurements[0].weight_kg+' kg':'—')+metric('Check-ins',cache.checkins?.length||0)+'</div><div class="card section"><h2>مرحبًا '+esc(profile.full_name||'بك')+'</h2><p class="muted">تابع برنامجك التدريبي وخطة التغذية وسجل تقدمك من أي جهاز.</p>'+ (a?'<div class="item"><b>'+esc(a.programs?.title||'برنامجك')+'</b><p>'+esc(a.nutrition_plans?.title||'خطة التغذية')+'</p></div>':'<p class="muted">لم يتم تعيين برنامج لك بعد. تواصل مع المدرب.</p>')+'</div>'}
function clientList(){if(!cache.clients.length)return '<div class="empty">لا يوجد عملاء مرتبطون حتى الآن.</div>';return '<div class="list">'+cache.clients.map(c=>'<div class="item"><div class="row"><div style="flex:1"><b>'+esc(c.profiles?.full_name||'عميل')+'</b><div class="muted">'+esc(c.profiles?.phone||'')+' · '+esc(c.status)+'</div></div><button class="btn" onclick="selectClient(\''+c.client_id+'\')">فتح الملف</button></div></div>').join('')+'</div>'}

async function createClientInvite(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let token=uid().replace(/-/g,'')+uid().replace(/-/g,'').slice(0,8);let r=await sb.from('client_invites').insert({coach_id:user.id,email:d.email.toLowerCase(),token:token,expires_at:new Date(Date.now()+7*86400000).toISOString()}).select().single();if(r.error)throw r.error;$('#inviteResult').innerHTML='<div class="notice"><b>تم إنشاء الدعوة</b><p>البريد: '+esc(d.email)+'</p><p>كود الدعوة:</p><code>'+esc(token)+'</code><div class="actions"><button class="btn" onclick="copyText(\''+token+'\')">نسخ الكود</button></div><small>صالح لمدة 7 أيام، ولا يعمل إلا مع البريد المحدد.</small></div>';e.target.reset();await loadCore()}
function programsPage(){return '<div class="card"><h2>إنشاء برنامج تدريبي</h2><form id="programForm"><div class="formgrid"><div class="field"><label>اسم البرنامج</label><input name="title" required></div><div class="field"><label>الهدف</label><select name="goal"><option value="fat_loss">خسارة الدهون</option><option value="muscle_gain">بناء العضلات</option><option value="recomposition">إعادة تشكيل الجسم</option><option value="strength">القوة</option><option value="general">لياقة عامة</option></select></div><div class="field"><label>المستوى</label><select name="level"><option>beginner</option><option>intermediate</option><option>advanced</option></select></div><div class="field"><label>عدد أيام الأسبوع</label><input name="days_per_week" type="number" min="1" max="7" value="4"></div><div class="field"><label>مدة البرنامج (أسابيع)</label><input name="duration_weeks" type="number" min="1" value="8"></div></div><button class="btn primary">إنشاء البرنامج</button></form></div>'+autoProgramForm()+'<div class="card section"><h2>برامجي</h2>'+programsList()+'</div><div class="card section"><h2>تعيين برنامج لعميل</h2><form id="assignProgramForm"><div class="formgrid"><div class="field"><label>العميل</label><select name="client_id" required>'+clientOptions()+'</select></div><div class="field"><label>البرنامج</label><select name="program_id" required>'+cache.programs.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join('')+'</select></div><div class="field"><label>خطة التغذية (اختياري)</label><select name="nutrition_plan_id"><option value="">بدون</option>'+cache.plans.map(p=>'<option value="'+p.id+'">'+esc(p.title)+'</option>').join('')+'</select></div><div class="field"><label>تاريخ البداية</label><input type="date" name="starts_on" value="'+dateNow()+'"></div></div><button class="btn primary">تعيين البرنامج</button></form></div>'}

async function loadClientProgress(){let id=$('#progressClient').value;if(!id)return;let [m,c,w]=await Promise.all([sb.from('measurements').select('*').eq('client_id',id).order('measured_at',{ascending:false}).limit(30),sb.from('daily_checkins').select('*').eq('client_id',id).order('checkin_date',{ascending:false}).limit(30),sb.from('workout_logs').select('*').eq('client_id',id).order('workout_date',{ascending:false}).limit(20)]);for(let x of [m,c,w])if(x.error)throw x.error;let html='<h3>القياسات</h3>'+m.data.map(x=>'<div class="metric"><span>'+esc(x.measured_at)+'</span><b>'+(x.weight_kg||'—')+' kg · '+(x.body_fat_percent||'—')+'% BF · خصر '+(x.waist_cm||'—')+'</b></div>').join('')+'<h3>Check-ins</h3>'+c.data.map(x=>'<div class="metric"><span>'+x.checkin_date+'</span><b>'+(x.body_weight_kg||'—')+' kg · التزام '+(x.adherence||'—')+' · طاقة '+(x.energy||'—')+'</b></div>').join('')+'<h3>سجل التدريب</h3>'+w.data.map(x=>'<div class="metric"><span>'+x.workout_date+'</span><b>'+esc(x.notes||'تمرين')+'</b></div>').join('');let advice=[];if(c.data.length){let recent=c.data.slice(0,7),avg=recent.reduce((s,x)=>s+Number(x.adherence||0),0)/recent.filter(x=>x.adherence!=null).length;if(Number.isFinite(avg)&&avg>0)advice.push('متوسط الالتزام في آخر المتابعات: '+avg.toFixed(1)+'/10. '+(avg>=8?'الالتزام جيد؛ راقب اتجاه الوزن والأداء قبل تعديل السعرات.':'الأولوية لتحسين الالتزام قبل خفض السعرات أو زيادة حجم التدريب.'));let weights=recent.map(x=>Number(x.body_weight_kg)).filter(x=>x>0);if(weights.length>=2)advice.push('فرق الوزن بين أحدث وأقدم متابعة معروضة: '+(weights[0]-weights[weights.length-1]).toFixed(2)+' كجم. لا تعدّل الخطة بناءً على قراءة واحدة.')}if(w.data.length){let ids=w.data.map(x=>x.id),sets=await sb.from('workout_sets').select('*').in('workout_log_id',ids).eq('is_warmup',false);if(sets.error)throw sets.error;let byExercise={};for(let s of sets.data){let log=w.data.find(z=>z.id===s.workout_log_id);if(!log)continue;(byExercise[s.exercise_name_snapshot]??=[]).push({...s,workout_date:log.workout_date})}let tips=[];for(let [name,rows] of Object.entries(byExercise)){let dates=[...new Set(rows.map(x=>x.workout_date))].sort().reverse();if(!dates.length)continue;let latest=rows.filter(x=>x.workout_date===dates[0]),top=Math.max(...latest.map(x=>Number(x.reps||0))),rpe=latest.map(x=>Number(x.rpe)).filter(x=>x>0);if(top>=12&&(!rpe.length||Math.max(...rpe)<=8))tips.push(name+': يمكن تجربة زيادة صغيرة 2–5% مع الحفاظ على جودة الأداء.');else if(rpe.some(x=>x>=9))tips.push(name+': حافظ على الحمل الحالي وراجع الاستشفاء والتكنيك.');if(tips.length>=5)break}if(tips.length)advice.push('مقترحات التدرج التدريبي (مراجعة المدرب): '+tips.join(' '))}html+='<div class="notice"><b>مراجعة المتابعة والتدرج</b><ul>'+advice.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><small>هذه توصيات مساعدة وليست تعديلًا تلقائيًا للأحمال أو السعرات.</small></div>';$('#progressResults').innerHTML=html}

function splitForDays(n){if(n<=2)return Array(n).fill(['chest','back','legs','shoulders','arms','core']);if(n===3)return [['chest','shoulders','arms'],['back','arms','core'],['legs','core']];if(n===4)return [['chest','shoulders','arms'],['legs','core'],['back','arms'],['legs','shoulders','core']];if(n===5)return [['chest','shoulders','arms'],['back','arms','core'],['legs','core'],['chest','back','shoulders'],['legs','arms']];return [['chest','shoulders','arms'],['back','arms','core'],['legs','core'],['chest','shoulders'],['back','arms'],['legs','core']]}
async function generateTraining(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),clientId=d.client_id;let a=await sb.from('client_assessments').select('*').eq('client_id',clientId).maybeSingle();if(a.error)throw a.error;if(!a.data)throw new Error('احفظ تقييم العميل أولًا من صفحة العملاء.');let assess=a.data,days=Math.max(1,Math.min(6,Number(assess.training_days)||4)),split=splitForDays(days),goal=assess.goal,level=assess.experience_level;let sets=level==='beginner'?2:level==='intermediate'?3:4,reps=goal==='strength'?'5-8':goal==='muscle_gain'?'6-12':'8-15';let title='برنامج '+({fat_loss:'خسارة الدهون',muscle_gain:'بناء العضلات',recomposition:'إعادة تشكيل الجسم',strength:'القوة',general:'اللياقة العامة'}[goal]||'تدريب')+' — '+(profile.full_name||'Coach Gado');let pr=await sb.from('programs').insert({coach_id:user.id,title,description:'مولد مبدئي من تقييم العميل. راجع التمارين والحجم التدريبي قبل الاعتماد.',goal,level,days_per_week:days,duration_weeks:Number(d.duration_weeks)||8,is_template:false}).select().single();if(pr.error)throw pr.error;let createdDays=[];try{for(let i=0;i<split.length;i++){let day=await sb.from('program_days').insert({program_id:pr.data.id,day_number:i+1,title:'Day '+(i+1)+' — '+split[i].join(' / '),notes:'إحماء مناسب، اترك 1–3 RIR، وزد الحمل تدريجيًا عند إكمال مدى التكرارات.'}).select().single();if(day.error)throw day.error;createdDays.push(day.data);let picked=[];for(let group of split[i]){let pool=cache.exercises.filter(x=>(x.muscle_group||'').toLowerCase()===group);if(assess.equipment?.[0]==='bodyweight')pool=pool.filter(x=>/bodyweight|body weight|none/i.test(x.equipment||''));if(assess.equipment?.[0]==='home_dumbbells')pool=pool.filter(x=>/dumbbell|bodyweight|body weight/i.test(x.equipment||''));let count=(group==='legs'||group==='back'||group==='chest')?2:1;for(let x of pool.slice(0,count))if(!picked.some(z=>z.id===x.id))picked.push(x)}if(picked.length<3)picked=cache.exercises.filter(x=>!picked.some(z=>z.id===x.id)).slice(0,4);let rows=picked.slice(0,7).map((x,j)=>({program_day_id:day.data.id,exercise_id:x.id,exercise_name_snapshot:x.name_ar||x.name,sets,reps,rest_seconds:goal==='strength'?150:90,sort_order:j,method:'straight',target_rir:level==='beginner'?3:2}));if(rows.length){let ins=await sb.from('program_exercises').insert(rows);if(ins.error)throw ins.error}}}catch(err){for(let day of createdDays){await sb.from('program_exercises').delete().eq('program_day_id',day.id);await sb.from('program_days').delete().eq('id',day.id)}await sb.from('programs').delete().eq('id',pr.data.id);throw err}await loadCore();toast('تم إنشاء البرنامج المقترح. راجعه قبل تعيينه.');go('programs')}

async function generateNutrition(e){e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),clientId=d.client_id;let ar=await sb.from('client_assessments').select('*').eq('client_id',clientId).maybeSingle();if(ar.error)throw ar.error;if(!ar.data)throw new Error('احفظ تقييم العميل أولًا من صفحة العملاء.');let a=ar.data,w=Number(a.current_weight_kg),h=Number(a.height_cm),age=Number(a.age),sex=a.sex==='female'?-161:5;let bmr=10*w+6.25*h-5*age+sex,activity={sedentary:1.2,light:1.375,moderate:1.55,high:1.725,very_high:1.9}[a.activity_level]||1.55,tdee=bmr*activity,cal=tdee*(a.goal==='fat_loss'?.82:a.goal==='muscle_gain'?1.08:a.goal==='strength'?1.03:0.98);cal=Math.round(cal/50)*50;let protein=Math.round(w*(a.goal==='fat_loss'?2.0:1.8)),fat=Math.round(w*.8),carbs=Math.max(50,Math.round((cal-protein*4-fat*9)/4));let plan=await sb.from('nutrition_plans').insert({coach_id:user.id,title:'خطة '+({fat_loss:'خسارة الدهون',muscle_gain:'بناء العضلات',recomposition:'إعادة تشكيل الجسم',strength:'القوة',general:'الصحة واللياقة'}[a.goal]||'العميل')+' — '+dateNow(),calories_target:cal,protein_target_g:protein,carbs_target_g:carbs,fats_target_g:fat,notes:'تقدير أولي بمعادلة Mifflin-St Jeor. راجع السعرات والماكروز والتفضيلات والحساسية قبل الاعتماد.'}).select().single();if(plan.error)throw plan.error;let n=Math.max(3,Math.min(5,Number(d.meal_count)||4)),mealRows=Array.from({length:n},(_,i)=>({nutrition_plan_id:plan.data.id,meal_order:i+1,title:['الإفطار','وجبة خفيفة','الغداء','وجبة خفيفة','العشاء'][i]||('وجبة '+(i+1)),notes:'اقتراح أولي قابل للتعديل'}));let meals=await sb.from('nutrition_meals').insert(mealRows).select();if(meals.error){await sb.from('nutrition_plans').delete().eq('id',plan.data.id);throw meals.error}let chicken=foodByMatch(['صدور دجاج']),rice=foodByMatch(['أرز أبيض']),eggs=foodByMatch(['بيض مسلوق']),oats=foodByMatch(['شوفان']),cottage=foodByMatch(['جبن قريش']),banana=foodByMatch(['موز']),fish=foodByMatch(['سمك بلطي']),potato=foodByMatch(['بطاطس مسلوقة']),oil= async function loadClientAssessment(){let r=await sb.from('client_assessments').select('*').eq('client_id',user.id).maybeSingle();if(r.error)throw r.error;let f=$('#assessmentForm');if(!f||!r.data)return;for(let [k,v] of Object.entries(r.data)){let el=f.elements[k];if(el&&v!=null)el.value=Array.isArray(v)?v[0]:v}}

function render(){if(!user||!profile)return;let body='';if(tab==='dashboard')body=dashboard();else if(isCoach()){if(tab==='clients')body=clientsPage();if(tab==='programs')body=programsPage();if(tab==='nutrition')body=nutritionPage();if(tab==='progress')body=progressPage();if(tab==='billing')body=billingPage();if(tab==='library')body=libraryPage()}else{if(tab==='training')body=clientTraining();if(tab==='nutrition')body=clientNutrition();if(tab==='progress')body=progressPage()}shell(body);wireForms();if(tab==='library')drawLibrary();if(tab==='progress'&&!isCoach())loadClientAssessment();if(tab==='billing')loadBilling();if(tab==='training'&&!isCoach())loadClientTraining();if(tab==='nutrition'&&!isCoach())loadClientMeals()}
function wireForms(){let bind=(id,fn)=>{let e=$(id);if(e)e.onsubmit=async ev=>{ev.preventDefault();try{await fn(ev)}catch(err){toast(err.message||'حدث خطأ',true)}}};bind('#assessmentForm',saveAssessment);bind('#autoProgramForm',generateTraining);bind('#autoNutritionForm',generateNutrition);bind('#inviteForm',createClientInvite);bind('#programForm',createProgram);bind('#assignProgramForm',assignProgram);bind('#nutritionForm',createNutrition);bind('#assignNutritionForm',assignNutrition);bind('#measurementForm',saveMeasurement);bind('#checkinForm',saveCheckin);bind('#subscriptionForm',saveSubscription);bind('#paymentForm',savePayment);bind('#exerciseForm',saveExercise);bind('#foodForm',saveFood)}
async function backupData(){try{let clientIds=cache.clients.map(x=>x.client_id),programIds=cache.programs.map(x=>x.id),planIds=cache.plans.map(x=>x.id);let pull=async(table,column,ids)=>{if(!ids.length)return[];let r=await sb.from(table).select('*').in(column,ids);if(r.error)throw r.error;return r.data||[]};let [days,meals,assignments,subscriptions,payments,measurements,checkins,workouts]=await Promise.all([pull('program_days','program_id',programIds),pull('nutrition_meals','nutrition_plan_id',planIds),sb.from('client_assignments').select('*').eq('coach_id',user.id),sb.from('client_subscriptions').select('*').eq('coach_id',user.id),sb.from('payments').select('*').eq('coach_id',user.id),pull('measurements','client_id',clientIds),pull('daily_checkins','client_id',clientIds),pull('workout_logs','client_id',clientIds)]);for(let r of [assignments,subscriptions,payments])if(r.error)throw r.error;let dayIds=days.map(x=>x.id),mealIds=meals.map(x=>x.id),workoutIds=workouts.map(x=>x.id);let [programExercises,mealFoods,workoutSets]=await Promise.all([pull('program_exercises','program_day_id',dayIds),pull('meal_foods','meal_id',mealIds),pull('workout_sets','workout_log_id',workoutIds)]);let payload={format_version:2,app:'Coach Gado Fitness Hub',exported_at:new Date().toISOString(),coach:{id:user.id,profile:profile},clients:cache.clients,programs:cache.programs,program_days:days,program_exercises:programExercises,foods:cache.foods,nutrition_plans:cache.plans,nutrition_meals:meals,meal_foods:mealFoods,client_assignments:assignments.data,client_subscriptions:subscriptions.data,payments:payments.data,measurements:measurements,daily_checkins:checkins,workout_logs:workouts,workout_sets:workoutSets};let b=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='coach-gado-cloud-backup-'+dateNow()+'.json';a.click();URL.revokeObjectURL(a.href);toast('تم تصدير نسخة احتياطية شاملة لبيانات حسابك')}catch(e){toast(e.message||'تعذر تصدير النسخة',true)}}
function printReport(){window.print()}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('تم نسخ الكود')}catch(e){toast('تعذر النسخ تلقائيًا: '+t,true)}}
async function logout(){await sb.auth.signOut();user=null;profile=null;cache={clients:[],programs:[],plans:[],foods:[],exercises:[],assignments:[]};showAuth('login')}
sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;profile=null;showAuth('login')}});
(async()=>{try{let s=await sb.auth.getSession();if(s.data.session){await startApp()}else showAuth('login')}catch(e){showAuth('login');toast(e.message||'تعذر الاتصال',true)}})();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
</script></body></html>
